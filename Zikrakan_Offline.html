
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zikrakan - زیکرەکان</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .quran-font { font-family: 'Amiri', serif; }
        .dark { background-color: #020617; color: #f8fafc; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { emerald: '#10b981', gold: '#fbbf24', cream: '#f8fafc' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-500">
    <div id="root"></div>

    <script type="text/babel">
        // --- DATA INJECTION ---
        const translations = {
            ku: {
                appName: 'زیکرەکان',
                morning: 'زیکری بەیانیان',
                evening: 'زیکری ئێواران',
                night: 'زیکری پێش خەوتن',
                prayer: 'زیکری دوای نوێژ',
                tasbih: 'تەسبیحات',
                namesOfAllah: 'نەوەد و نۆ ناوی خودا',
                stats: 'پێشکەوتنەکانم',
                settings: 'ڕێکخستنەکان',
                language: 'زمان',
                theme: 'ڕووکار',
                zikrs: 'زیکرەکان',
                hadith: 'فەرموودە',
                dailyZikr: 'زیکری ڕۆژ',
                dailyHadith: 'فەرموودەی ڕۆژ',
                dailyAyah: 'ئایەتی ڕۆژ',
                completed: 'تەواو بوو',
                remaining: 'ماوە',
                total: 'کۆی گشتی',
                level: 'ئاست',
                points: 'خاڵەکان',
                walletBalance: 'باڵانسی ئێستا',
                iqd: 'دینار',
                withdrawNow: 'ئێستا ڕاکێشە',
                minWithdrawalNote: 'کەمترین بڕی ڕاکێشان ٥,٠٠٠ دینارە',
                paymentMethod: 'شێوازی پارەدان',
                accountOrPhone: 'ژمارەی ئەکاونت / تەلەفۆن',
                spiritualLevel: 'ئاستی ڕۆحی',
                totalGoal: 'ئامانجی گشتی',
                morningCenter: 'بەیانیت باش',
                afternoonCenter: 'نیوەڕۆت باش',
                eveningCenter: 'ئێوارەت باش',
                nightCenter: 'شەوت شاد',
                duaFooterKu: 'لە دوعای خێر بێبەشم مە',
                duaFooterAr: 'لا تنسوني من صالح دعائکم',
                duaFooterEn: 'Please remember me in your prayers',
                gratitudeAyah: '"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ"',
                gratitudeTafsir: 'ئەگەر سوپاسگوزاری بکەن، ئەوا نیعمەتەکانتان بۆ زیاد دەکەم.'
            },
            // ... (Arabic and English would follow)
        };

        // --- APP COMPONENTS ---
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = FramerMotion;

        const App = () => {
            const [language, setLanguage] = useState(localStorage.getItem('lang') || 'ku');
            const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');
            const [currentView, setCurrentView] = useState('home');
            const t = translations[language];

            useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                localStorage.setItem('theme', theme);
            }, [theme]);

            // Simplified Mock Logic for Single File Demo
            return (
                <div className="min-h-screen pb-32">
                    {/* Header */}
                    <div className="p-6 flex justify-between items-center bg-white dark:bg-slate-900 shadow-sm">
                        <h1 className="text-2xl font-black text-brand-emerald">{t.appName}</h1>
                        <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} className="p-3 bg-slate-100 dark:bg-slate-800 rounded-full">
                           {theme === 'light' ? '🌙' : '☀️'}
                        </button>
                    </div>

                    {/* Main Content (Mocking level selection) */}
                    <main className="p-6 max-w-lg mx-auto">
                        <div className="bg-brand-emerald/10 dark:bg-brand-emerald/20 p-8 rounded-[3rem] text-center space-y-4">
                            <h2 className="text-xl font-bold dark:text-white">
                                {language === 'ku' ? 'خێرهاتن بۆ ئەپی زیکرەکان' : 'Welcome to Zikrakan'}
                            </h2>
                            <p className="text-sm text-slate-500 dark:text-slate-400">
                                ئەمە تەنها نموونەیەکی بچووککراوەی ئەپەکەیە. بۆ بینینی هەموو بەشەکان، ئەپە سەرەکییەکە بەکاربهێنە.
                            </p>
                        </div>
                    </main>

                    {/* Footer Supplication */}
                    <footer className="fixed bottom-0 left-0 right-0 p-8 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 text-center space-y-2">
                        <p className="text-[10px] font-black text-brand-emerald uppercase tracking-widest leading-none">
                            {language === 'ku' ? t.gratitudeAyah : 'Ayah of Gratitude'}
                        </p>
                        <p className="text-[10px] font-bold text-slate-400">
                            {language === 'ku' ? t.gratitudeTafsir : 'If you are thankful, I will increase you.'}
                        </p>
                        <div className="pt-4">
                           <p className="text-[12px] font-bold italic text-slate-500 dark:text-slate-400">
                                {language === 'ku' ? t.duaFooterKu : language === 'ar' ? t.duaFooterAr : t.duaFooterEn}
                           </p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
